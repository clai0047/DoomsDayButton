<!DOCTYPE html>
<html>
<head>
    <title>Doomsday Button</title>
     <link href="styles.css" rel="stylesheet"/>
</head>
<body>
    <h1>HOVER THE CURSOR BEFORE PRESS THE DOOMSDAY BUTTON!</h1>
    <main class="container">
        <button class="doomsday">
            <div class="instructions">ATTENTION!!!<br> When you press the doomsday button, you will be taken out of the matrix!</div>
        </button>
    </main>
    <div class="explosion-screen" aria-live="assertive" aria-hidden="true">
        <span>BOOM</span>
    </div>

    <script>
        const doomsdayButton = document.querySelector('.doomsday');
        const instructions = document.querySelector('.instructions');
        const explosionScreen = document.querySelector('.explosion-screen');
        let holdTimeout;
        let activePointerId = null;
        let hasDetonated = false;

        doomsdayButton.addEventListener('mouseenter', () => {
            instructions.style.opacity = '1';
        });

        doomsdayButton.addEventListener('mouseleave', () => {
            instructions.style.opacity = '0';
        });

        doomsdayButton.addEventListener('pointerdown', (event) => {
            if (event.button !== 0 || hasDetonated) {
                return;
            }

            clearTimeout(holdTimeout);
            activePointerId = event.pointerId;
            doomsdayButton.setPointerCapture(event.pointerId);
            holdTimeout = window.setTimeout(() => {
                hasDetonated = true;
                activePointerId = null;
                explosionScreen.classList.add('is-visible');
                explosionScreen.setAttribute('aria-hidden', 'false');
            }, 3000);
        });

        function cancelHold(event) {
            if (event.pointerId !== activePointerId) {
                return;
            }

            clearTimeout(holdTimeout);
            holdTimeout = undefined;
            activePointerId = null;
        }

        window.addEventListener('pointerup', cancelHold);
        window.addEventListener('pointercancel', cancelHold);
        window.addEventListener('blur', () => {
            clearTimeout(holdTimeout);
            holdTimeout = undefined;
            activePointerId = null;
        });
    </script>
</body>
</html>
