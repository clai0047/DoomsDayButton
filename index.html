<!DOCTYPE html>
<html>
<head>
    <title>Doomsday Button</title>
     <link href="styles.css" rel="stylesheet"/>
</head>
<body>
    <h1>HOVER THE CURSOR BEFORE PRESS THE DOOMSDAY BUTTON!</h1>
    <main class="container">
        <button class="doomsday">
            <div class="instructions">ATTENTION!!!<br> When you press the doomsday button, you will be taken out of the matrix!</div>
            <span class="countdown" aria-live="polite" aria-atomic="true"></span>
        </button>
    </main>
    <div class="explosion-screen" aria-live="assertive" aria-hidden="true">
        <span>BOOM</span>
    </div>

    <script>
        const doomsdayButton = document.querySelector('.doomsday');
        const instructions = document.querySelector('.instructions');
        const countdown = document.querySelector('.countdown');
        const explosionScreen = document.querySelector('.explosion-screen');
        let activationTimeout;
        let countdownInterval;
        let activePointerId = null;
        let hasDetonated = false;
        const holdDuration = 3000;

        function cancelActivation() {
            clearTimeout(activationTimeout);
            clearInterval(countdownInterval);
            activationTimeout = undefined;
            countdownInterval = undefined;
            activePointerId = null;
            countdown.classList.remove('is-counting');
            countdown.textContent = '';
        }

        doomsdayButton.addEventListener('mouseenter', () => {
            instructions.style.opacity = '1';
        });

        doomsdayButton.addEventListener('mouseleave', () => {
            instructions.style.opacity = '0';
        });

        doomsdayButton.addEventListener('pointerdown', (event) => {
            if (event.button !== 0 || hasDetonated) {
                return;
            }

            cancelActivation();
            activePointerId = event.pointerId;
            const detonationTime = Date.now() + holdDuration;
            countdown.classList.add('is-counting');
            countdown.textContent = '3';
            countdownInterval = window.setInterval(() => {
                const secondsLeft = Math.ceil((detonationTime - Date.now()) / 1000);
                countdown.textContent = String(Math.max(secondsLeft, 1));
            }, 100);
            activationTimeout = window.setTimeout(() => {
                clearInterval(countdownInterval);
                countdownInterval = undefined;
                countdown.classList.remove('is-counting');
                countdown.textContent = '';
                hasDetonated = true;
                explosionScreen.classList.add('is-visible');
                explosionScreen.setAttribute('aria-hidden', 'false');
            }, holdDuration);
        });

        window.addEventListener('pointerup', (event) => {
            if (event.pointerId === activePointerId) {
                cancelActivation();
            }
        });

        window.addEventListener('pointercancel', (event) => {
            if (event.pointerId === activePointerId) {
                cancelActivation();
            }
        });

        window.addEventListener('blur', cancelActivation);
    </script>
</body>
</html>
